name: Deploy — Production

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECS_CLUSTER: lumenflow-production

jobs:
  # ── 1. Build + push Docker images (tagged with git tag) ─────────────────
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: production           # requires manual approval in GitHub Environments
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag from git tag
        id: meta
        run: echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/api:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/api:latest
          cache-from: type=gha,scope=api-prod
          cache-to: type=gha,mode=max,scope=api-prod

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/web:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/web:latest
          cache-from: type=gha,scope=web-prod
          cache-to: type=gha,mode=max,scope=web-prod

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/worker:${{ steps.meta.outputs.image_tag }}
            ${{ steps.login-ecr.outputs.registry }}/lumenflow/worker:latest
          cache-from: type=gha,scope=worker-prod
          cache-to: type=gha,mode=max,scope=worker-prod

  # ── 2. Run DB migrations ────────────────────────────────────────────────
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    needs: build-images
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lumenflow/api exec prisma generate
      - name: Run migrations
        run: pnpm --filter @lumenflow/api exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

  # ── 3. Deploy to ECS Fargate ────────────────────────────────────────────
  deploy-ecs:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update API service
        run: |
          bash infra/scripts/ecs-update-service.sh \
            ${{ env.ECS_CLUSTER }} \
            lumenflow-production-api \
            "${{ needs.build-images.outputs.ecr_registry }}/lumenflow/api:${{ needs.build-images.outputs.image_tag }}"

      - name: Update Web service
        run: |
          bash infra/scripts/ecs-update-service.sh \
            ${{ env.ECS_CLUSTER }} \
            lumenflow-production-web \
            "${{ needs.build-images.outputs.ecr_registry }}/lumenflow/web:${{ needs.build-images.outputs.image_tag }}"

      - name: Update Worker service
        run: |
          bash infra/scripts/ecs-update-service.sh \
            ${{ env.ECS_CLUSTER }} \
            lumenflow-production-worker \
            "${{ needs.build-images.outputs.ecr_registry }}/lumenflow/worker:${{ needs.build-images.outputs.image_tag }}"

  # ── 4. Smoke test ───────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-ecs
    steps:
      - name: Wait for API to be healthy
        run: |
          curl \
            --retry 10 \
            --retry-delay 20 \
            --retry-connrefused \
            --fail \
            https://api.lumenflow.app/health

  # ── 5. Slack notification ───────────────────────────────────────────────
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: smoke-test
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          STATUS="${{ needs.smoke-test.result }}"
          COLOR=$([ "$STATUS" = "success" ] && echo "good" || echo "danger")
          EMOJI=$([ "$STATUS" = "success" ] && echo "rocket" || echo "x")
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"text\": \":$EMOJI: Production deployment *${{ github.ref_name }}* $STATUS\",
                \"footer\": \"Deployed by ${{ github.actor }}\"
              }]
            }"

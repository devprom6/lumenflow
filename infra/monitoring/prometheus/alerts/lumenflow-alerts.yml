groups:
  - name: lumenflow-operational-alerts
    rules:
      - alert: HighQuoteLatency
        expr: histogram_quantile(0.95, sum(rate(lumenflow_quote_latency_seconds_bucket[5m])) by (le, type)) > 2.5
        for: 5m
        labels:
          severity: warning
          tier: core
        annotations:
          summary: "High quote generation latency for {{ $labels.type }}"
          description: "95th percentile quote latency for {{ $labels.type }} exceeds 2.5s for more than 5 minutes (current value: {{ $value }}s)."
          runbook_url: "docs/runbooks/provider-outage.md"

      - alert: LowSwapSuccessRate
        expr: 100 * (sum(rate(lumenflow_swap_success_total[10m])) / (sum(rate(lumenflow_swap_success_total[10m])) + sum(rate(lumenflow_swap_failure_total[10m])) > 0 or 1)) < 90
        for: 5m
        labels:
          severity: critical
          tier: core
        annotations:
          summary: "Stellar swap success rate below 90%"
          description: "Swap success rate has dropped below 90% over the last 10 minutes."
          runbook_url: "docs/runbooks/provider-outage.md"

      - alert: StuckBridgeTransferDetected
        expr: sum(lumenflow_stuck_transfers_count) > 0
        for: 2m
        labels:
          severity: critical
          tier: bridge
        annotations:
          summary: "Cross-chain bridge transfer stuck in processing"
          description: "One or more bridge transfers have exceeded their expected delivery window and require operator intervention."
          runbook_url: "docs/runbooks/stuck-bridge-transfer.md"

      - alert: HighWorkerQueueDepth
        expr: lumenflow_queue_depth > 100
        for: 5m
        labels:
          severity: warning
          tier: worker
        annotations:
          summary: "BullMQ queue {{ $labels.queue }} depth backlog"
          description: "Queue {{ $labels.queue }} has more than 100 pending/waiting jobs for over 5 minutes."
          runbook_url: "docs/runbooks/failed-payout.md"

      - alert: ReconciliationMismatchDetected
        expr: sum(increase(lumenflow_reconciliation_mismatches_total[15m])) > 0
        for: 1m
        labels:
          severity: critical
          tier: compliance
        annotations:
          summary: "Ledger discrepancy detected during reconciliation audit"
          description: "Nightly/hourly reconciliation job detected discrepancy between internal orders and external statements."
          runbook_url: "docs/runbooks/failed-payout.md"

      - alert: HighWebhookFailureRate
        expr: sum(rate(lumenflow_worker_jobs_processed_total{queue="webhook-retries", status="failed"}[5m])) > 5
        for: 3m
        labels:
          severity: warning
          tier: webhooks
        annotations:
          summary: "Excessive webhook dispatch failures"
          description: "Worker webhook-retries queue has high rate of failed retries (potential DLQ exhaustion)."
          runbook_url: "docs/runbooks/webhook-replay.md"
